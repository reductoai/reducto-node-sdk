name: spec-drift
# Fails when the SDK types drift from the committed spec snapshot, spec/openapi.json.
# The snapshot is refreshed by hand (bun run spec-drift --update-snapshot), so this
# check needs no network and does not turn red when the upstream API changes under
# an unrelated PR.
# See scripts/spec-drift.ts and CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  check:
    name: spec drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check spec drift
        id: drift
        continue-on-error: true
        run: |
          set -o pipefail
          bun run spec-drift | tee drift.txt

      - name: Write job summary
        run: |
          {
            echo "## Spec drift"
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on drift
        if: steps.drift.outcome == 'failure'
        run: |
          echo "::error::SDK types drift from spec/openapi.json. See the job summary."
          exit 1
